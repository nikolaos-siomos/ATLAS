[Channels]
# All variables provided for this section should include exactly as many channels as the recorder_channel_id variable. 
# If a variable is not relevant for a specific channel (e.g. dead_time for analog channels) fill with “_”. 
#-------------------------------------------------------------------------------------------------------------
#Mandatory Variables
#-------------------------------------------------------------------------------------------------------------

#recorder_channel_id: IDs of each channel according to the raw file header (string).
#    • For most licel systems: provide the licel id per channel that is going to be include. Currently only BT and BC channels are supported.
#    • For licel systems using both memory A and B: provide a recorder_channel_id that combines both the licel_id and the laser_id per channel that is going to be include in the following format <licel_id>_<laser_id>, for example: BT0_L1, BT0_L2. This is necessary because the same licel_id is used for both memories
#    • For PollyXT systems provide an ascending number per channel starting at 1 and following the order of the channels in the raw PollyXT files. 
# A subset of the recorder channels can be provided. Only the channels provided here will be processed
recorder_channel_id = 

#scc_channel_id: The SCC channel IDs (integer). Mandatory only if submitting to CARS for an evaluation of a configuration. IDs of each channel according to the SCC configuration. In the future, linking with the HOI will be done through the scc_channel_id (currently optional). 
scc_channel_id = 

#telescope_type: The telescope configuration (string). Choose among:
#    • x: single telescope 
#    • y: second telescope 
#    • z: third telescope 
#    • n: near range
#    • o: second near range telescope (higher or similar overlap to n will be assumed if both are available)
#    • p: third near range telescope (higher or similar overlap to p, or n if m is not available, will be assumed if both are available)
#    • d: third far range telescope (lower or similar overlap to e, or f if m is not available, will be assumed if both are available)
#    • e: second far range telescope (lower or similar overlap to f will be assumed if both are available)
#    • f: far range
# Summary of assumed overlap order: n < o < p < x, y, z < d < e < f
telescope_type = 

#channel_type: The channel type (string). Choose one among:
#    • p: co-polar
#    • c: cross-polar
#    • t: total (no depolarization)
#    • v: vibrational Raman
#    • r: rotational Raman
#    • a: Cabannes
#    • f: fluorescence 
channel_type = 

#channel_subtype: The channel subtype (string). Choose among:
#    • r: Signal Reflected from a PBS
#    • t: Signal Transmitted through a PBS
#    • n: N2 Ramal line
#    • o: O2 Ramal line
#    • w: H2O Ramal line
#    • c: CH4 Ramal line
#    • h: High Rotational Raman
#    • l: Low Rotational Raman
#    • a: Mie (aerosol) HSRL signal
#    • m: Molecular HSRL signal
#    • b: Broadband Fluorescence
#    • s: Spectral Fluorescence
#    • x: No specific subtype 
channel_subtype = 

#-------------------------------------------------------------------------------------------------------------
#Partly Optional Variables -- These variables take default values. It is highly recommended though to fill
#them in because  might not be valid for the system.
#-------------------------------------------------------------------------------------------------------------
#zero_bin: The zero bin (integer). Provide only if known, otherwise it defaults to 0. The offset of the data acquisition trigger with respect to the Q-switch per channel in bins. Provide negative values if the acquisition starts before the Q-switch (pre-triggering) and positive values if the acquisition starts after the Q-switch
zero_bin = 

#dead_time: The dead time of the photon counting channels (float, in ns). (for analog channels set _). Defaults to 3.7ns for the non-paralyzable case
dead_time = 

#background_low_bin: Starting bin of the background correction averaging range (integer). Defaults to:
#    • The bin that is located 40 bins before the zero_bin if the zero_bin < 400
#    • The 50th bin if the zero_bin > 240 
#Using default values is currently risky. Please make sure that no spikes are appearing in the pretrigger range that would affect the background correction or manually provide this variable.
background_low_bin = 

#background_high_bin: ending bin of the background correction averaging range (integer). Defaults to:
#    • The 50th bin before the end of the profile if the zero_bin <= 240
#    • The bin that corresponds to the last 10% of the bin range (e.g. bin 8192 * 0.9 for a channel with 8192 bins) if the zero_bin > 240 
#Using default values is currently risky. Please make sure that no spikes are appearing in the pretrigger range that would affect the background correction or manually provide this variable.
background_high_bin = 

#G: The G polarisation cross-talk parameter related to the GHK correction (float). Cross-talk correction can even be applied total or Raman channels if the GH parameters are known. Use _ if the G parameter is unknown to apply the default values depending on the channel type and subtype. 
G = 

#H: The H polarisation cross-talk parameter related to the GHK correction (float). Cross-talk correction can even be applied total or Raman channels if the GH parameters are known. Use _ if the H parameter is unknown to apply the default values depending on the channel type and subtype. 
H = 

#-------------------------------------------------------------------------------------------------------------
#Optional Variables (include only to override the raw file metadata)
#-------------------------------------------------------------------------------------------------------------
#acquisition_mode: The mode of the recorded signals per channel (string). Choose among:
#    • a: analog
#    • p: photon counting
acquisition_mode = 

#detected_wavelength: The wavelength of the detected signal according to the applied Interference Filter of each channel (float, in nm). This variable is provided by default from the raw file metadata but if accuracy is required for molecular calculations the exact central wavelength should be provided.
detected_wavelength =

#emitted_wavelength: The wavelength of the originally emitted laser beam per channel (float). A very rough guess process is applied by default using that detected channel information that it is valid ONLY for Nd:Yag lasers with elastic and vibrational Raman channels. Please provide the values explicitly if your system does not fall in this category. Defaults to:
#    • 354.71 for channels with detected wavelength <520nm
#    • 532.07 for channels with detected wavelength <1000nm 
#    • 1064.14 for channels with detected wavelength >=1000nm
#If accurate molecular depolarization ratio calculations are required this variable should be filled in with the actual emitted wavelength with sub-nanometer accuracy.
emitted_wavelength = 

#analog_noise_scaling_factor: A factor applied to analog channels for the calculation of the random error per bin. Calculated by the nsf QA test. Leave empty if not known. 
analog_noise_scaling_factor = 

#channel_bandwidth: Interference filter Bandwidth (float, in nm, Defaults to: 1nm). The default value is a very rough guess and it can easily lead to high uncertainty in the molecular depolarization value. Exact values provided from the manufacturers should be used instead. Note that this is an optional field when the file_format argument is set to polly_xt.
channel_bandwidth = 

#range_resolution: The range resolution of each channel [m]. It will be used to calculate the Sampling Rate  (float)
range_resolution = 

#laser_repetition_rate: The Laser Repetition Rate [Hz] (float)
laser_repetition_rate = 

[polarization_calibration]
#ch_r: Provide here channel the recorder_channel_id corresponding to reflected channels that will be matched to transmitted channels. Use only channels with the channel_subtype set to r (e.g. 0355xpar). The number of reflected channels provided by ch_r must be the same as the number of the respective transmitted channels provided by ch_t. By default, all available reflected channels will be matched to all available transmitted channels that share the same wavelength, telescope type, and acquisition mode. 
ch_r = 
 
#ch_t: Provide here channel the recorder_channel_id corresponding to transmitted channels that will be matched to reflected channels. Use only channels with the channel_subtype set to t (e.g. 0355xcat). The number of transmitted channels provided by ch_t must be the same as the number of the respective reflected channels provided by ch_r. By default, all available reflected channels will be matched to all available transmitted channels that share the same wavelength, telescope type, and acquisition mode. 
ch_t =

#K: The K value for each channel pair. Provide exactly as many values as the number of transmitted (ch_t) and reflected (ch_r) channels. Defaults to: 1 for all channels 
K =

#R_to_T_transmission_ratio: The transmission ratio of the R to T channels per pair (T_R/T_T). T_R = 1 and/or T_T = 1 if no filter was applied during calibration. Provide exactly as many values as the number of transmitted (ch_t) and reflected (ch_r) channels. Defaults to: 1 for all pairs
R_to_T_transmission_ratio = 

#[gluing]
##ch_l: Provide here channel the atlas_channel_id corresponding to channels used for the lower part of the glued signal. Valid gluing combinations are channels with different telescope types and/or acquisition modes while the channel type, subtype, and wavelength are the same. Channels with telescope type set to x, y, or z cannot be glued. Gluing of glued channels is also possible (e.g. gluing analog and photon channels of telescope n and f first and then gluing the newly created glued channels of telescopes n and f). The number of lower region channels provided by ch_l must be the same as the number of upper region channels provided by ch_t. By default, lower range channels will be matched to higher range channels that share the same wavelength, channel type and channel subtype based on their telescope type and acquisition mode. Analog (low) and photon (high) channels will be glued first. For example 0355npar would be glued with 0355nppr to create 0355npgr,  0355opar would be glued with 0355oppr to create 0355opgr, 0355fpar would be glued with 0355fppr to create 0355fpgr, then 0355npgr would be glued with 0355opgr and 0355fpgr to create 0355gpgr   
#ch_l = 
 
