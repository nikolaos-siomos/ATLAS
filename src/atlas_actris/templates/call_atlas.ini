# Cloudnet station name used when Cloudnet. If provided, ATALS will attempt downloading
# ECMWF meteorological files from Cloudnet to extract the temperature, pressure, and
# relative humidity parameters. The name of the station must be provided exactly as define
# in the Cloudnet API. This is not necessary the same as the display name in the web
# interface.
# Default: empty parameter --> ignored or automatic selection
# Example: garmish
# Version note for cloudnet_station_name: New in ATLAS 1.0.0.
cloudnet_station_name =

# Radiosonde station name displayed in plots. If an ECMW file is used, the station name is
# used for displaying instead and this parameter is ignored.
# Default: empty parameter --> ignored or automatic selection
# Example: Thessaloniki
# Version note for rsonde_station_name: Moved in ATLAS <=0.5.0.
rsonde_station_name =

