# Default: empty parameter --> ignored or automatic selection
# Example: ray_pcb
force_qa_test =

# Enable or disable background correction for this complete channel-comparison bundle.
# Default: empty parameter --> ignored or automatic selection
# Example: True
background_correction =

# Channel-specific background interval in kilometres, applied to every system in this
# comparison. Empty falls back to the general value or later reference-channel metadata.
# Required list size: 2
# Default: empty parameter --> ignored or automatic selection
# Example: 18.0, 22.0
background_region =

# Enable or disable normalization for this complete channel-comparison bundle.
# Default: empty parameter --> ignored or automatic selection
# Example: True
normalisation =

# Channel-specific normalization interval in kilometres, applied to every system in this
# comparison. Empty falls back to the general value or later reference-channel metadata.
# Required list size: 2
# Default: empty parameter --> ignored or automatic selection
# Example: 7.5, 9.0
normalisation_region =

# Override whether this channel bundle is normalized to the reference molecular profile.
# Default: empty parameter --> ignored or automatic selection
# Example: True
normalise_to_molecular =

# Override whether the reference molecular profile is plotted for this channel bundle.
