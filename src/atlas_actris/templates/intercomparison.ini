# ============================================================================
# ATLAS intercomparison initialization file
#
# Generated from the parser schemas and template flavor metadata.
# Values are intentionally left empty. Parser defaults are applied at runtime.
# Regenerate with: atlas-generate-templates
#
# Dataset sections define where/how data are read.
# Channel/pair group sections define which corresponding products are compared.
#
# ============================================================================

[general]

# Folder where intercomparison plots, tables, and cached products are written. Relative
# paths are resolved against the folder containing this INI file.
# Required: no
# Default: ./analysis
# Example: ./analysis
output_folder =

# If True, existing intercomparison outputs with the same names may be overwritten.
# Required: no
# Default: False
# Example: False
overwrite_output =

# Universal fallback QA test. A dataset-specific qa_test takes priority.
# Required: no
# Default: ray
# Allowed / limits: ray, drk, pcb, tlc, tlc_rin, ray_pcb, pcb_aux, trg, dtm, cam
# Example: ray
default_qa_test =

# Universal fallback exported-stage parameter containing channel signals. A dataset-
# specific signal_source takes priority.
# Required: no
# Default: profile
# Example: profile
default_signal_source =

# Universal fallback exported-stage parameter containing channel uncertainties. A dataset-
# specific signal_error_source takes priority.
# Required: no
# Default: profile_error
# Example: profile_error
default_signal_error_source =

# Universal fallback exported-stage parameter containing channel-pair products. A dataset-
# specific pair_source takes priority.
# Required: no
# Default: pol_cal_ratio_mean
# Example: pol_cal_ratio_mean
default_pair_source =

# Universal fallback exported-stage parameter containing channel-pair uncertainties. A
# dataset-specific pair_error_source takes priority.
# Required: no
# Default: pol_cal_ratio_error_mean
# Example: pol_cal_ratio_error_mean
default_pair_error_source =

# Vertical coordinate used by vertical harmonization and later plotting. Allowed values
# are bins, range, height_agl, and height_asl. All four coordinates are loaded when
# available. Default: height_asl.
# Required: no
# Default: height_asl
# Allowed / limits: bins, range, height_agl, height_asl
# Example: height_asl
vertical_scale =

# Vertical harmonization method. interpolation maps every participating dataset to the
# coarsest native grid in that group so no dataset is upscaled. vertical_binning applies
# conservative overlap-weighted binning onto a common regular grid. Default:
# interpolation.
# Required: no
# Default: interpolation
# Allowed / limits: interpolation, vertical_binning
# Example: interpolation
vertical_method =

# Default conservative vertical-bin width used when vertical_method=vertical_binning. For
# physical vertical scales it is specified in kilometres; for bins it is in bin units.
# Default: 0.1 km for physical scales. A group-specific vertical_bin_width overrides this
# value. If the requested width is smaller than the coarsest nominal native step in a
# group, ATLAS warns and uses that coarsest native step instead.
# Required: no
# Default: 0.1
# Allowed / limits: > 0.0
# Example: 0.1
vertical_bin_width =

# Left edge of the first bin in the common conservative grid. For physical vertical scales
# it is specified in kilometres; for bins it is in bin units. Default: 0. Each output
# vertical-scale value is assigned to the center of its bin. Leading bins with no source
# overlap are retained and filled with NaN.
# Required: no
# Default: 0.0
# Example: 0.0
first_bin_left_edge =

# Optional lower retained limit for the common binned grid. For physical vertical scales
# it is specified in kilometres; for bins it is in bin units. Empty starts from
# first_bin_left_edge.
# Required: no
# Default: empty (None)
# Example: 0.5
vertical_min =

# Optional upper retained limit for the common binned grid. For physical vertical scales
# it is specified in kilometres; for bins it is in bin units. Empty extends to the largest
# available vertical extent in the group.
# Required: no
# Default: empty (None)
# Example: 15.0
vertical_max =

# If True, vertical harmonization is skipped for plotting and every dataset is shown on
# its native selected vertical scale. The right-hand relative-difference panel is left
# without curves because the vertical samples are not aligned. Default: False.
# Required: no
# Default: False
# Example: False
plot_native_scale =

# Optional temporal slices as repeating start, stop pairs. Accepted formats match
# call_atlas.ini: HHMM, yyyymmdd, yyyymmdd_HH, yyyymmdd_HHMM, or yyyymmdd_HHMMSS.
# Required: no
# Default: empty list
# Example: 20260801_2100, 20260802_0200
slice_measurement =

# Optional temporal exclusions as repeating start, stop pairs, using the same time formats
# as slice_measurement.
# Required: no
# Default: empty list
# Example: 20260801_2330, 20260801_2345
exclude_measurement =

# Default background-correction switch for channel groups. A value set directly in a
# [channel_group:<id>] section overrides this default.
# Required: no
# Default: False
# Example: False
default_channel_background_correction =

# Default channel background region in kilometres. A channel-group background_region
# overrides it.
# Required: no
# Default: 18.0, 22.0
# Allowed / limits: size=2
# Example: 18.0, 22.0
default_channel_background_region =

# Default normalization switch for channel groups. A channel-group normalisation value
# overrides it.
# Required: no
# Default: True
# Example: True
default_channel_normalisation =

# Default channel normalization region in kilometres. A channel-group normalisation_region
# overrides it.
# Required: no
# Default: 4.0, 6.0
# Allowed / limits: size=2
# Example: 4.0, 6.0
default_channel_normalisation_region =

# Default channel normalization target. If True, channel groups are normalized to the
# reference dataset's molecular profile; if False, they are normalized to the reference
# measured signal.
# Required: no
# Default: True
# Example: True
default_channel_normalise_to_molecular =

# Default switch controlling whether the reference molecular channel profile is included
# in plots.
# Required: no
# Default: True
# Example: True
default_channel_plot_molecular =

# Default background-correction switch for pair groups. A value set directly in a
# [pair_group:<id>] section overrides this default.
# Required: no
# Default: False
# Example: False
default_pair_background_correction =

# Default pair background region in kilometres. A pair-group background_region overrides
# it.
# Required: no
# Default: 18.0, 22.0
# Allowed / limits: size=2
# Example: 18.0, 22.0
default_pair_background_region =

# Default normalization switch for pair groups. Pair normalization is always to the
# reference measured pair ratio, never to the molecular ratio.
# Required: no
# Default: False
# Example: False
default_pair_normalisation =

# Default pair normalization region in kilometres. A pair-group normalisation_region
# overrides it.
# Required: no
# Default: 7.5, 9.0
# Allowed / limits: size=2
# Example: 7.5, 9.0
default_pair_normalisation_region =

# Default switch controlling whether the reference molecular ratio is included in pair
# plots.
# Required: no
# Default: True
# Example: True
default_pair_plot_molecular =

# Resolution of exported figures in dots per inch.
# Required: no
# Default: 150
# Allowed / limits: > 1
# Example: 150
dpi =

# If True, apply the ATLAS image color-reduction workflow to exported figures.
# Required: no
# Default: False
# Example: False
color_reduction =


# Global plotting defaults. Group-level plotting values override these.
[plotting]

# Default horizontal limits for channel-group intercomparison plots. Empty means determine
# them automatically from the plotted vertical data. Units follow vertical_scale: km for
# physical scales, bin units for bins.
# Required: no
# Default: 0, 30
# Allowed / limits: size=2
# Example: 0.0, 20.0
channel_x_lims =

# Default horizontal limits for pair-group intercomparison plots. Empty means determine
# them automatically from the plotted vertical data. Units follow vertical_scale: km for
# physical scales, bin units for bins.
# Required: no
# Default: 0, 10
# Allowed / limits: size=2
# Example: 0.0, 10.0
pair_x_lims =

# Default major horizontal-axis tick spacing for intercomparison plots. Units follow
# vertical_scale.
# Required: no
# Default: 2.0
# Allowed / limits: > 0.0
# Example: 1.0
x_tick =

# Default right-panel y-axis limits for channel-group relative differences. Group-specific
# difference_y_lims can override these values.
# Required: no
# Default: -0.4, 0.4
# Allowed / limits: size=2
# Example: -0.4, 0.4
channel_difference_y_lims =

# Default right-panel y-axis limits for pair-group absolute differences. Empty means
# determine them automatically from the SNR-filtered absolute differences. Group-specific
# difference_y_lims can override these values.
# Required: no
# Default: -0.1, 0.1
# Allowed / limits: size=2
# Example: -0.1, 0.1
pair_difference_y_lims =

# Default left-panel y limits for channel-group plots. Empty means determine them
# automatically from all plotted channel signals and, when enabled, the reference
# molecular profile.
# Required: no
# Default: empty list
# Allowed / limits: size=2
channel_y_lims =

# Default smoothing switch for channel-group plots. Smoothing/local-STD estimation is used
# only for data that are not conservatively binned. Harmonized vertical_binning plots use
# the binned signal and propagated error directly.
# Required: no
# Default: True
# Example: True
channel_smooth =

# Default channel smoothing range. Units follow vertical_scale: km for physical scales,
# bin units for bins.
# Required: no
# Default: 0.05, 31.0
# Allowed / limits: size=2
# Example: 0.05, 35.0
channel_smoothing_range =

# Default channel smoothing window. Units follow vertical_scale: km for physical scales,
# bin units for bins.
# Required: no
# Default: 0.5
# Allowed / limits: > 0.0
# Example: 0.5
channel_smoothing_window =

# Default left-panel y limits for pair-group plots. Empty means determine them
# automatically.
# Required: no
# Default: 0, 0.1
# Allowed / limits: size=2
pair_y_lims =

# Default smoothing switch for pair-group plots. Smoothing/local-STD estimation is used
# only for data that are not conservatively binned. Harmonized vertical_binning plots use
# the binned values and propagated errors directly.
# Required: no
# Default: True
# Example: True
pair_smooth =

# Default pair smoothing range. Units follow vertical_scale: km for physical scales, bin
# units for bins.
# Required: no
# Default: 0.05, 11.0
# Allowed / limits: size=2
# Example: 0.05, 10.0
pair_smoothing_range =

# Default pair smoothing window. Units follow vertical_scale: km for physical scales, bin
# units for bins.
# Required: no
# Default: 0.5
# Allowed / limits: > 0.0
# Example: 0.5
pair_smoothing_window =


# Repeat one [dataset:<dataset_id>] section per comparison dataset.
# Dataset IDs are arbitrary; reference status is defined only by reference = True.
[dataset:dataset_a_reference]

# Absolute or relative path to one exported ATLAS stage directory. Different datasets may
# point to different stage paths, or multiple datasets may intentionally point to the same
# stage path with different QA/source selections.
# Required: yes
# Default: none (must be provided)
# Example: ../dataset_a/exported/preprocessing_complete
stage_path =

# Set True for exactly one dataset. Its vertical grid, molecular profile, product IDs, and
# metadata defaults define the comparison reference.
# Required: no
# Default: False
# Example: True
reference =

# Optional label for the physical lidar/system that produced this dataset. Multiple
# datasets may share the same system_label.
# Required: no
# Default: empty (None)
# Example: Lidar A
system_label =

# Optional label describing this particular dataset or processing realization. When empty,
# later code may fall back to the dataset section ID.
# Required: no
# Default: empty (None)
# Example: Rayleigh processing
dataset_label =

# QA test used when reading this dataset. When empty, default_qa_test from [general] is
# used.
# Required: no
# Default: empty (None)
# Allowed / limits: ray, drk, pcb, tlc, tlc_rin, ray_pcb, pcb_aux, trg, dtm, cam
# Example: ray
qa_test =

# Exported-stage parameter containing channel signals for this dataset. When empty,
# default_signal_source is used.
# Required: no
# Default: empty (None)
# Example: profile
signal_source =

# Exported-stage parameter containing channel uncertainties for this dataset. When empty,
# default_signal_error_source is used.
# Required: no
# Default: empty (None)
# Example: profile_error
signal_error_source =

# Exported-stage parameter containing pair products for this dataset. When empty,
# default_pair_source is used.
# Required: no
# Default: empty (None)
# Example: pol_cal_ratio_mean
pair_source =

# Exported-stage parameter containing pair uncertainties for this dataset. When empty,
# default_pair_error_source is used.
# Required: no
# Default: empty (None)
# Example: pol_cal_ratio_error_mean
pair_error_source =


[dataset:dataset_b]

# Absolute or relative path to one exported ATLAS stage directory. Different datasets may
# point to different stage paths, or multiple datasets may intentionally point to the same
# stage path with different QA/source selections.
# Required: yes
# Default: none (must be provided)
# Example: ../dataset_a/exported/preprocessing_complete
stage_path =

# Set True for exactly one dataset. Its vertical grid, molecular profile, product IDs, and
# metadata defaults define the comparison reference.
# Required: no
# Default: False
# Example: True
reference =

# Optional label for the physical lidar/system that produced this dataset. Multiple
# datasets may share the same system_label.
# Required: no
# Default: empty (None)
# Example: Lidar A
system_label =

# Optional label describing this particular dataset or processing realization. When empty,
# later code may fall back to the dataset section ID.
# Required: no
# Default: empty (None)
# Example: Rayleigh processing
dataset_label =

# QA test used when reading this dataset. When empty, default_qa_test from [general] is
# used.
# Required: no
# Default: empty (None)
# Allowed / limits: ray, drk, pcb, tlc, tlc_rin, ray_pcb, pcb_aux, trg, dtm, cam
# Example: ray
qa_test =

# Exported-stage parameter containing channel signals for this dataset. When empty,
# default_signal_source is used.
# Required: no
# Default: empty (None)
# Example: profile
signal_source =

# Exported-stage parameter containing channel uncertainties for this dataset. When empty,
# default_signal_error_source is used.
# Required: no
# Default: empty (None)
# Example: profile_error
signal_error_source =

# Exported-stage parameter containing pair products for this dataset. When empty,
# default_pair_source is used.
# Required: no
# Default: empty (None)
# Example: pol_cal_ratio_mean
pair_source =

# Exported-stage parameter containing pair uncertainties for this dataset. When empty,
# default_pair_error_source is used.
# Required: no
# Default: empty (None)
# Example: pol_cal_ratio_error_mean
pair_error_source =


# Repeat one [channel_group:<group_id>] section per channel comparison group.
[channel_group:355_parallel]

# Optional channel-group display label. When empty, the reference dataset's
# atlas_channel_id is used.
# Required: no
# Default: empty (None)
# Example: 355 nm parallel
label =

# Optional channel-group override for background correction. Empty inherits
# default_channel_background_correction from [general].
# Required: no
# Default: empty (None)
# Example: False
background_correction =

# Optional channel-group override for the background interval in kilometres. Empty
# inherits default_channel_background_region from [general].
# Required: no
# Default: empty (None)
# Allowed / limits: size=2
# Example: 18.0, 22.0
background_region =

# Optional channel-group override for normalization. Empty inherits
# default_channel_normalisation from [general].
# Required: no
# Default: empty (None)
# Example: True
normalisation =

# Optional channel-group override for the normalization interval in kilometres. Empty
# inherits default_channel_normalisation_region from [general].
# Required: no
# Default: empty (None)
# Allowed / limits: size=2
# Example: 4.0, 6.0
normalisation_region =

# Optional channel-group override. True normalizes every participating channel to the
# reference dataset's molecular profile; False normalizes every channel to the reference
# measured signal.
# Required: no
# Default: empty (None)
# Example: True
normalise_to_molecular =

# Optional channel-group override controlling whether the reference molecular profile is
# plotted. Empty inherits default_channel_plot_molecular from [general].
# Required: no
# Default: empty (None)
# Example: True
plot_molecular =

# Optional channel-group conservative bin-width override. Empty uses [general]
# vertical_bin_width. If the requested width is smaller than the coarsest nominal native
# step in this group, ATLAS warns and uses the coarsest native step instead.
# Required: no
# Default: empty (None)
# Allowed / limits: > 0.0
# Example: 0.03
vertical_bin_width =

# Optional channel-group plotting smoothing override. Empty inherits channel_smooth from
# [plotting].
# Required: no
# Default: empty (None)
# Example: True
smooth =

# Optional channel-group smoothing-range override. Empty inherits channel_smoothing_range
# from [plotting].
# Required: no
# Default: empty (None)
# Allowed / limits: size=2
# Example: 0.05, 35.0
smoothing_range =

# Optional channel-group smoothing-window override. Empty inherits
# channel_smoothing_window from [plotting].
# Required: no
# Default: empty (None)
# Allowed / limits: > 0.0
# Example: 0.5
smoothing_window =

# Optional channel-group x-axis limits. Empty inherits channel_x_lims from [plotting]; an
# empty resolved value triggers automatic limits.
# Required: no
# Default: empty (None)
# Allowed / limits: size=2
# Example: 0.0, 20.0
x_lims =

# Optional channel-group major x-axis tick spacing. Empty inherits x_tick from [plotting].
# Required: no
# Default: empty (None)
# Allowed / limits: > 0.0
# Example: 2.0
x_tick =

# Optional channel-group left-panel y limits. Empty inherits channel_y_lims from
# [plotting]; an empty resolved value triggers automatic limits.
# Required: no
# Default: empty (None)
# Allowed / limits: size=2
y_lims =

# Optional channel-group right-panel y-axis limits for relative differences. Empty
# inherits channel_difference_y_lims from [plotting].
# Required: no
# Default: empty (None)
# Allowed / limits: size=2
# Example: -0.4, 0.4
difference_y_lims =

# Channel-group logarithmic-y switch. Default: True. Set False in this group to use a
# linear left-panel y axis.
# Required: no
# Default: True
# Example: True
use_log_y_scale =

# --- dataset_a_reference ---
# ATLAS channel ID selected from this dataset for the channel group. Leave empty or omit
# the parameter to exclude this dataset from the group. If all dataset channel IDs are
# empty, the group is ignored. For an active group, the reference dataset must provide an
# ID.
# Example: 0355xpgx
dataset_a_reference.atlas_channel_id =

# --- dataset_b ---
# ATLAS channel ID selected from this dataset for the channel group. Leave empty or omit
# the parameter to exclude this dataset from the group. If all dataset channel IDs are
# empty, the group is ignored. For an active group, the reference dataset must provide an
# ID.
# Example: 0355xpgx
dataset_b.atlas_channel_id =


