# ============================================================================
# ATLAS intercomparison initialization file template
# ============================================================================
#
# Generated by ATLAS 1.1.0
#
# Developers should not edit this generated file manually.
# Update parse_intercomparison_file.py or intercomparison_template_flavor.py
# and regenerate with: atlas-generate-intercomparison-template
#
# Users should copy this file and configure the repeated system/channel/pair
# sections. Relative paths are resolved against this file's directory.
#
# ============================================================================

[general]

# Folder where intercomparison plots, tables, and cached products are written. Relative
# paths are resolved against the folder containing this INI file.
# Default: analysis
# Example: ./analysis
output_folder =

# If True, existing intercomparison outputs with the same names may be overwritten.
# Default: False
# Example: False
overwrite_output =

# General QA-test source used by channel and pair comparisons unless force_qa_test is
# provided in that comparison section.
# Allowed values: ray, drk, pcb, tlc, tlc_rin, ray_pcb, pcb_aux, trg, dtm, cam
# Default: ray
# Example: ray
default_qa_test =

# Fallback exported-stage parameter containing channel signals. A source specified for the
# reference system in a channel bundle becomes the effective default for all systems in
# that bundle.
# Default: profile
# Example: profile
default_signal_source =

# Fallback exported-stage parameter containing channel uncertainties. A source specified
# for the reference system in a channel bundle becomes the effective default for all
# systems in that bundle.
# Default: profile_error
# Example: profile_error
default_signal_error_source =

# Fallback exported-stage parameter containing channel-pair products. A source specified
# for the reference system in a pair bundle becomes the effective default for all systems
# in that bundle.
# Default: pol_cal_ratio_mean
# Example: pol_cal_ratio_mean
default_pair_source =

# Fallback exported-stage parameter containing channel-pair uncertainties. A source
# specified for the reference system in a pair bundle becomes the effective default for
# all systems in that bundle.
# Default: pol_cal_ratio_error_mean
# Example: pol_cal_ratio_error_mean
default_pair_error_source =

# Physical vertical coordinate used for all comparisons. height_asl is strongly
# recommended because systems may be located at different station altitudes.
# Allowed values: height_asl, height_agl, range
# Default: height_asl
# Example: height_asl
vertical_scale =

# Method used to place systems on a common physical vertical grid. interpolation uses the
# reference-system grid; vertical_binning creates common altitude intervals.
# Allowed values: interpolation, vertical_binning
# Default: interpolation
# Example: interpolation
vertical_method =

# Vertical bin width in kilometres. Required only when vertical_method is
# vertical_binning.
# Minimum: 0.0
# Default: empty parameter --> ignored or automatic selection
# Example: 0.03
vertical_binning =

# Optional lower comparison and plotting limit in kilometres. Empty uses the common valid
# overlap.
# Default: empty parameter --> ignored or automatic selection
# Example: 0.5
vertical_min =

# Optional upper comparison and plotting limit in kilometres. Empty uses the common valid
# overlap.
# Default: empty parameter --> ignored or automatic selection
# Example: 15.0
vertical_max =

# Optional temporal slices as repeating start, stop pairs. Accepted formats match
# call_atlas.ini: HHMM, yyyymmdd, yyyymmdd_HH, yyyymmdd_HHMM, or yyyymmdd_HHMMSS.
# Default: empty parameter --> ignored or automatic selection
# Example: 20260801_2100, 20260802_0200
slice_measurement =

# Optional temporal exclusions as repeating start, stop pairs, using the same time formats
# as slice_measurement.
# Default: empty parameter --> ignored or automatic selection
# Example: 20260801_2330, 20260801_2345
exclude_measurement =

# General switch for subtracting the mean signal in background_region. Disabled by default
# and overridable per channel comparison.
# Default: False
# Example: False
background_correction =

# General fallback background interval in kilometres. A channel-specific value takes
# priority; when empty, later metadata loading may use the reference channel's stored
# region.
# Required list size: 2
# Default: empty parameter --> ignored or automatic selection
# Example: 18.0, 22.0
background_region =

# General switch for channel normalization. It may be disabled or overridden per channel
# comparison. Pair products are not normalized.
# Default: True
# Example: True
normalisation =

# General fallback normalization interval in kilometres. A channel-specific value takes
# priority; when empty, later metadata loading uses the reference channel's stored
# Rayleigh-fit region.
# Required list size: 2
# Default: empty parameter --> ignored or automatic selection
# Example: 7.5, 9.0
normalisation_region =

# If True, normalize measured channel profiles to the reference system's molecular profile
# using arithmetic means over the resolved normalization region.
# Default: True
# Example: True
normalise_to_molecular =

# If True, include the reference system's molecular profile in channel-comparison plots.
# Default: True
# Example: True
plot_molecular =

# Resolution of exported figures in dots per inch.
# Minimum: 1
# Default: 150
# Example: 150
dpi =

# If True, apply the ATLAS image color-reduction workflow to exported figures.
# Default: False
# Example: False
color_reduction =


# Repeat one [system:<system_id>] section per exported ATLAS system.
[system:reference_system]

# Absolute or relative path to one exported ATLAS stage directory. The path may point
# anywhere and no common parent-folder layout is required.
# Default: empty parameter --> ignored or automatic selection
# Example: ../reference_system/exported/preprocessing_complete
stage_path =

# Set True for exactly one system. Its vertical grid, molecular profile, data IDs, source
# parameters, and channel-specific metadata defaults define the comparison reference.
# Default: False
# Example: True
reference =

# Optional display label. When empty, metadata loading will use lidar_name and finally the
# system section ID as fallback.
# Default: empty parameter --> ignored or automatic selection
# Example: Reference lidar
label =


[system:system_b]

# Absolute or relative path to one exported ATLAS stage directory. The path may point
# anywhere and no common parent-folder layout is required.
# Default: empty parameter --> ignored or automatic selection
# Example: ../reference_system/exported/preprocessing_complete
stage_path =

# Set True for exactly one system. Its vertical grid, molecular profile, data IDs, source
# parameters, and channel-specific metadata defaults define the comparison reference.
# Default: False
# Example: True
reference =

# Optional display label. When empty, metadata loading will use lidar_name and finally the
