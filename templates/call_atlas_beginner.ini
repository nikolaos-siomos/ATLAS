[explicit_paths]

# Absolute or relative path to the folder containing the input lidar data. If empty,
# defaults to the directory containing the initialization file. Measurement folder aliases
# are resolved relative to parent_folder. Relative paths are resolved from the directory
# containing the initialization file used to run ATLAS.
# Default: empty parameter --> ignored or automatic selection
# Example: .
# Version note for parent_folder: Unchanged from previous ATLAS versions.
parent_folder =

# Absolute or relative path to the ATLAS configuration file containing system, channel,
# and channel-pair metadata. If empty and export_hoi_cfg is 0, uses config_file.ini beside
# the initialization file; this file must exist. For export_hoi_cfg 1 or 2, leave this
# entry empty: ATLAS prepares config_file_<scc_configuration_id>.ini in the initialization
# directory for SCC HOI export or download. Relative paths are resolved from the directory
# containing the initialization file used to run ATLAS.
# Default: empty parameter --> ignored or automatic selection
# Example: ./config_file.ini
# Version note for atlas_configuration_file: Unchanged from previous ATLAS versions.
atlas_configuration_file =

# Absolute or relative path to the optional ATLAS settings file containing QA test and
# plotting settings. If empty, uses settings_file.ini beside the initialization file when
# present; otherwise uses the built-in settings defaults. An explicitly provided file must
# exist. Relative paths are resolved from the directory containing the initialization file
# used to run ATLAS.
# Default: empty parameter --> ignored or automatic selection
# Example: ./settings_file.ini
# Version note for atlas_settings_file: Unchanged from previous ATLAS versions.
atlas_settings_file =

# Absolute or relative path to the folder containing radiosonde files. If empty, defaults
# to the radiosondes subfolder beside the initialization file, which is created if needed.
# Ignored when radiosonde_file is provided. Relative paths are resolved from the directory
# containing the initialization file used to run ATLAS.
# Default: empty parameter --> ignored or automatic selection
# Example: ./radiosondes/
# Version note for radiosonde_folder: Unchanged from previous ATLAS versions.
radiosonde_folder =

# Absolute or relative path to a specific radiosonde file. If provided, takes precedence
# over radiosonde_folder. Relative paths are resolved from the directory containing the
# initialization file used to run ATLAS.
# Default: empty parameter --> ignored or automatic selection
# Example: ./radiosondes/20231221_1527_ecmwf_bucharest.nc
# Version note for radiosonde_file: New in ATLAS 1.0.0.
radiosonde_file =

# Absolute or relative path for ATLAS outputs (plots, ASCII, cached data, and exported
# stages). If empty, outputs go to the analysis subfolder beside the initialization file.
# If explicitly provided, outputs go to a subfolder named after parent_folder inside the
# specified directory. Relative paths are resolved from the directory containing the
# initialization file used to run ATLAS.
# Default: empty parameter --> ignored or automatic selection
# Example: ./results
# Version note for output_folder: New in ATLAS 1.0.0.
output_folder =


[general_options]

# The user can choose specific QA test(s) to process. Choose one or more of the allowed
# keys to process the corresponding QA tests. If left empty, ATLAS keeps the standard
# default behaviour. If one or more tests are provided, empty process_qck and process_bgd
# entries are derived automatically from this selection.
# Allowed values: ray, pcb, tlc, tlc_rin, drk, trg, dtm, ray_pcb, pcb_aux, cam, off
# Default: ray, pcb, tlc, tlc_rin, drk, trg, dtm, ray_pcb, pcb_aux, cam
# Example: ray, pcb, tlc
# Version note for process: Unchanged from previous ATLAS versions.
process =

# Generate profile quicklooks for specific QA tests. When process is explicitly selected
# and process_qck is left empty, this list is derived automatically from process. An
# explicit process_qck value overrides that derived list. VLDR quicklooks are controlled
# separately by process_vldr.
# Allowed values: ray, pcb, tlc, tlc_rin, ray_pcb, pcb_aux, trg, dtm, drk, drk_ray,
# drk_pcb, drk_tlc, drk_tlc_rin, drk_ray_pcb, drk_pcb_aux, drk_trg, drk_dtm, off
# Default: ray, pcb, tlc, tlc_rin, ray_pcb, pcb_aux
# Example: ray, drk
# Version note for process_qck: Unchanged from previous ATLAS versions.
process_qck =

# Generate background time-series plots for specific QA tests. When process is explicitly
# selected and process_bgd is left empty, this list is derived automatically from process.
# An explicit process_bgd value overrides that derived list.
# Allowed values: ray, pcb, tlc, tlc_rin, ray_pcb, pcb_aux, trg, dtm, drk, drk_ray,
# drk_pcb, drk_tlc, drk_tlc_rin, drk_ray_pcb, drk_pcb_aux, drk_trg, drk_dtm, off
# Default: off
# Example: ray, drk
# Version note for process_bgd: New in ATLAS 1.0.1.
process_bgd =

# Generate VLDR quicklook plots independently of process and process_qck. VLDR quicklooks
# are enabled by default and can be disabled explicitly with process_vldr = False.
# Default: True
# Example: True
# Version note for process_vldr: New in ATLAS 1.0.1.
process_vldr =


[trimming_options]

# The maximum height in km agl above which signal will be trimmed after the signal
