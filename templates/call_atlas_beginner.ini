# Select temporal regions to process using repeating triplets:<test_folder_alias>,
# <start_time>, <stop_time> The same test folder alias can appear multiple times. Accepted
# time formats: HHMM, yyyymmdd, yyyymmdd_HH, yyyymmdd_HHMM, yyyymmdd_HHMMSS For HHMM only,
# intervals crossing midnight are handled automatically, e.g. 2300 to 0135 means next day.
# For absolute formats, write the next date explicitly. Available test folder aliases:
# ['drk', 'drk_dtm', 'drk_pcb', 'drk_pcb_aux', 'drk_ray', 'drk_ray_pcb', 'drk_tlc',
# 'drk_tlc_rin', 'drk_trg', 'dtm', 'pcb', 'pcb_aux', 'pcb_aux_m45', 'pcb_aux_p45',
# 'pcb_m45', 'pcb_p45', 'ray', 'ray_pcb', 'tlc', 'tlc_east', 'tlc_inner', 'tlc_north',
# 'tlc_outer', 'tlc_rin', 'tlc_south', 'tlc_west', 'trg']
# Default: empty parameter --> ignored or automatic selection
# Example: slice_measurement = drk, 2300, 0135, ray, 20251204_2300, 20251205_0600, tlc, 20251205_071510, 20251205_071545, ray_pcb, 20251205_08, 20251205_09
# Version note for slice_measurement: Moved in ATLAS <=0.5.0 from settings_file. Old names
# removed in ATLAS 1.0.0.
