[project]
name = "atlas_actris"
version = "1.2.0.rc2"

authors = [
    { name = "Nikolaos Siomos", email = "nikolaos.siomos@lmu.de" },
    { name = "Livio Belegante", email = "livio@inoe.ro" },
    { name = "Georgia Peletidou", email = "gpeletid@auth.gr" },
    { name = "Peristera Paschou", email = "pepaschou@noa.gr" },
    { name = "Håvard Buholdt", email = "buholdt@tropos.de" },   
]

# GNU Affero General Public License v3 or later
license = { text = "AGPL-3.0-or-later" }

readme = "README.md"
requires-python = ">=3.9,<3.14"

dependencies = [
    # Core numerical stack
    "numpy>=1.26.4,<3; python_version < '3.13'",
    "numpy>=2.1.3,<3; python_version >= '3.13'",

    "scipy>=1.13.0,<2; python_version < '3.13'",
    "scipy>=1.14.1,<2; python_version >= '3.13'",

    "pandas>=2.2.0,<3",
    "xarray>=2024.7.0,<2026",

    # NetCDF / HDF / lidar file support
    "netCDF4>=1.6.3,<2",
    "h5py>=3.10.0,<4",
    "h5netcdf>=1.3,<2",

    # Lazy processing and cache storage
    "dask>=2024.8.0,<2026; python_version < '3.13'",
    "dask>=2024.12.0,<2026; python_version >= '3.13'",
    "zarr>=2.18.0,<3",

    # ACTRIS molecular calculations
    "arc-actris>=1.1.0,<2",

    # Download / web access
    "requests>=2.31.0,<3",

    # Plotting
    "matplotlib>=3.8.0,<4",
    "Pillow>=10.0.0,<12",

    # Interactive plotting / signal viewer
    # Current HoloViz releases require Python >=3.10, so keep
    # Python 3.9 on the last compatible release lines.
    "panel>=1.4,<1.5; python_version < '3.10'",
    "panel>=1.5,<2; python_version >= '3.10'",
    "hvplot>=0.11,<0.12; python_version < '3.10'",
    "hvplot>=0.12,<0.13; python_version >= '3.10'",
    "holoviews>=1.19,<1.22; python_version < '3.10'",
    "holoviews>=1.22,<2; python_version >= '3.10'",

    # DOCX report export
    "python-docx>=1.1.0,<2",
]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5,<2.0",
    "mkdocs-material>=9,<10",
]

dev = [
    "pytest>=8,<9",
]

[project.urls]
Homepage = "https://github.com/nikolaos-siomos/ATLAS"
Issues = "https://github.com/nikolaos-siomos/ATLAS/issues"

# ----------------------------------------------------------
# CLI commands provided by your package
# ----------------------------------------------------------
[project.scripts]
atlas = "atlas_actris.cli:main"
atlas-signal-viewer = "atlas_actris.cli_viewer:main"
atlas-smoke-test = "atlas_actris.testing.smoke_test:main"
atlas-signal-viewer-smoke-test = "atlas_actris.testing.signal_viewer_smoke_test:main"
atlas-generate-templates = "atlas_actris.templates.generator:main"
atlas-intercomparison = "atlas_actris.cli_intercomparison:main"

# ----------------------------------------------------------
# Setuptools configuration for src/atlas_actris layout
# ----------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]
include = ["atlas_actris*"]
namespaces = false

# Runtime-owned intercomparison defaults remain package data. Generated user
# templates are written to the repository-root templates directory instead.
[tool.setuptools.package-data]
atlas_actris = ["intercomparison/*.ini"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
